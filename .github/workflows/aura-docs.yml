name: AURA Documentation Automationon:  push:    branches:      - main  workflow_dispatch:permissions:  contents: writejobs:  documentation:    runs-on: ubuntu-latest    steps:    - name: Checkout repository      uses: actions/checkout@v4      with:        fetch-depth: 0    - name: Setup Python      uses: actions/setup-python@v5      with:        python-version: "3.11"    - name: Install documentation tools      run: |        pip install tree-cli    - name: Generate project tree      run: |        mkdir -p docs/generated        tree -I ".git|venv|__pycache__" > docs/generated/project_tree.txt    - name: Generate documentation timestamp      run: |        echo "# AURA Documentation Update" > docs/generated/build_info.md        echo "" >> docs/generated/build_info.md        echo "Generated: $(date)" >> docs/generated/build_info.md    - name: Commit documentation updates      run: |        git config --global user.name "AURA Documentation Bot"        git config --global user.email "aura-bot@github.com"        git add docs/generated        git diff --cached --quiet || git commit -m "Auto update AURA documentation"        git push